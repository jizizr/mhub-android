name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (shared contract) and debug build
        run: ./gradlew :core:test :app:assembleDebug --console=plain

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: contract/ and docs/ match mhub-ios
        run: scripts/check-shared.sh
