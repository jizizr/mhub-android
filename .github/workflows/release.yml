name: Release

# Push a tag such as v0.1.0-beta.1. Tags with a suffix are published as pre-releases.
# Secrets: MHUB_KEYSTORE_BASE64, MHUB_KEYSTORE_PASSWORD, MHUB_KEY_ALIAS, MHUB_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version and keystore
        env:
          KEYSTORE: ${{ secrets.MHUB_KEYSTORE_BASE64 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MHUB_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "MHUB_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          test -n "$KEYSTORE" || { echo "::error::MHUB_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MHUB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed release
        env:
          MHUB_KEYSTORE_PASSWORD: ${{ secrets.MHUB_KEYSTORE_PASSWORD }}
          MHUB_KEY_ALIAS: ${{ secrets.MHUB_KEY_ALIAS }}
          MHUB_KEY_PASSWORD: ${{ secrets.MHUB_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease --console=plain
      - name: Verify and rename
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/MHub-$VERSION.apk"
          (cd dist && sha256sum "MHub-$VERSION.apk" | tee "MHub-$VERSION.apk.sha256")
          rm -f "$MHUB_KEYSTORE_FILE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > dist/notes.md <<NOTES
          MHub Android $VERSION。需要 Android 13 及以上，以及自托管的 [MHub](https://github.com/jizizr/mhub) 服务端。

          直接下载 APK 安装；之后的版本使用同一签名，可覆盖升级。

          首次启动填写服务端地址（保存前会请求 \`/health\`）。
          NOTES
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag \
            --title "MHub Android $VERSION" --notes-file dist/notes.md \
            "dist/MHub-$VERSION.apk" "dist/MHub-$VERSION.apk.sha256"
